name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Only one CI run per ref; cancel earlier runs when a new push lands so PR
# checks reflect only the latest commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Workflow only reads the repo and runs scripts. No write needed.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # --legacy-peer-deps: required because eslint-plugin-jsx-a11y@^6 still
      # peers on ESLint <=9 while this repo runs ESLint 10. Remove this flag
      # once jsx-a11y publishes an ESLint 10-compatible release.
      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Build
        run: npm run build
